<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Interactive family tree built with HTML, CSS and JavaScript from a JSON dataset — ITT588 Lab Work 04." />
  <title>Family Tree — ITT588 Lab 4</title>

  <!-- Fonts: a serif for the "heritage" feel, a clean sans for UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Skip link for keyboard users -->
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <!-- Small tree icon (inline SVG so it inherits the theme colour) -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="2.5" /><circle cx="5" cy="19" r="2.5" /><circle cx="19" cy="19" r="2.5" /><circle cx="12" cy="19" r="2.5" />
          <path d="M12 7.5v9M12 12H5v4.5M12 12h7v4.5" />
        </svg>
      </span>
      <span class="brand-text" id="family-title">Family Tree</span>
    </a>

    <!-- Main navigation; the active link is highlighted by app.js -->
    <nav class="main-nav" aria-label="Main">
      <a href="#/" data-route="home">Home</a>
      <a href="#/tree" data-route="tree">Tree</a>
      <a href="#/members" data-route="members">Members</a>
      <a href="#/relate" data-route="relate">Relationships</a>
    </nav>

    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Toggle theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <!-- Every page is rendered into #main by app.js (hash-based routing) -->
  <main id="main" tabindex="-1" aria-live="polite">
    <div class="loading" role="status">
      <span class="spinner" aria-hidden="true"></span>
      Loading family data…
    </div>
  </main>

  <footer class="site-footer">
    <p>ITT588 Front-End Technology · Lab Work 04 · Muhammad Zaqwan bin Mohamad Hussen (2025140555)</p>
    <p>Data loaded from <code>data/people.json</code></p>
  </footer>

  <!-- ES module entry point -->
  <script type="module" src="js/app.js"></script>

  <!--
    Browsers refuse to run ES modules or fetch JSON from file:// pages,
    so app.js never starts if index.html is double-clicked. Explain how
    to open it properly instead of showing "Loading…" forever.
  -->
  <script>
    if (location.protocol === "file:") {
      document.getElementById("main").innerHTML =
        '<section class="panel narrow error-panel" role="alert">' +
        "<h1>Please open this through a web server</h1>" +
        "<p>Browsers block JavaScript modules and JSON files on pages opened straight from a folder.</p>" +
        "<p>In VS Code, right-click <code>index.html</code> and choose <b>Open with Live Server</b>, " +
        "or run <code>python -m http.server</code> in this folder and visit <code>http://localhost:8000</code>.</p>" +
        "</section>";
    }
  </script>
</body>
</html>
